amcl:
  ros__parameters:
    # params to modify
    min_particles: 100 # Minimum allowed number of particles.
    max_particles: 200 # Maximum allowed number of particles.
    update_min_d: 1.0 # Translational movement required before performing a filter update.
    update_min_a: 1.0 # Rotational movement required before performing a filter update.
    resample_interval: 1 # Number of filter updates required before resampling.
    laser_min_range: -1.0 # Minimum scan range to be considered; -1.0 will cause the laser's reported minimum range to be used.
    laser_max_range: 3.0 # Maximum scan range to be considered; -1.0 will cause the laser's reported maximum range to be used.
    max_beams: 180 # How many evenly-spaced beams in each scan to be used when updating the filter.
    robot_model_type: "nav2_amcl::DifferentialMotionModel" # Which model to use, either "nav2_amcl::DifferentialMotionModel" or "nav2_amcl::OmniMotionModel".

    # ==========================
    set_initial_pose: True

    scan_topic: "scan"

    ###########################

    pf_err: 0.02

    transform_tolerance: 0.5
    recovery_alpha_slow: 0.00
    recovery_alpha_fast: 0.00

    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    sigma_hit: 0.2
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_model_type: "likelihood_field"

    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    odom_frame_id: "odom"
    base_frame_id: "base_footprint"
