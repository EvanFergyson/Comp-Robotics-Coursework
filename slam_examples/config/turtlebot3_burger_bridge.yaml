# ros_gz_bridge configuration for the simulated TurtleBot3 burger.
#
# Gazebo Sim does not talk ROS. Every topic this package consumes has to be
# bridged explicitly here, including /clock -- without it nothing that runs
# with use_sim_time will ever advance.
#
# The ros_topic_name entries reproduce the topic names the Gazebo Classic
# version of this package produced, so the RViz configs, octomap remappings
# and AMCL scan_topic keep working unchanged.

# Simulator core
- ros_topic_name: "clock"
  gz_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# JointStatePublisher plugin
- ros_topic_name: "joint_states"
  gz_topic_name: "joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# DiffDrive plugin
- ros_topic_name: "odom"
  gz_topic_name: "odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# DiffDrive plugin: odom -> base_footprint
- ros_topic_name: "tf"
  gz_topic_name: "tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# DiffDrive plugin input. On Jazzy turtlebot3_teleop publishes TwistStamped.
# For plain-Twist publishers (teleop_twist_keyboard, or Nav2 with
# enable_stamped_cmd_vel left at false) change ros_type_name to
# geometry_msgs/msg/Twist -- a second entry for the same gz topic does not
# work, one bridge process can only advertise a given gz topic once.
- ros_topic_name: "cmd_vel"
  gz_topic_name: "cmd_vel"
  ros_type_name: "geometry_msgs/msg/TwistStamped"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# Imu system
- ros_topic_name: "imu"
  gz_topic_name: "imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# Sensors system: LDS lidar
- ros_topic_name: "scan"
  gz_topic_name: "scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# Sensors system: D435 depth camera. The point cloud is what octomap_server
# consumes, on the name the launch files already remap cloud_in to.
- ros_topic_name: "depth_camera/depth/points"
  gz_topic_name: "depth_camera/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

- ros_topic_name: "depth_camera/color/image_raw"
  gz_topic_name: "depth_camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "depth_camera/depth/image_rect_raw"
  gz_topic_name: "depth_camera/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "depth_camera/camera_info"
  gz_topic_name: "depth_camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# The rgbd_camera sensor advertises a single camera_info; the Classic setup
# exposed it under the depth namespace too, so keep both names alive.
- ros_topic_name: "depth_camera/depth/camera_info"
  gz_topic_name: "depth_camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
